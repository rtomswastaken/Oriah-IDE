[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oriah"
version = "0.1.0"
description = "Oriah IDE - AI Agent Terminal Environment & Agentic Workflow Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.0",
    "pygments>=2.18.0",
    "rich>=14.0.0",
    "typing-extensions>=4.10.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
oriah = "oriah.app:main"
oriah-agent = "oriah.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oriah*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
